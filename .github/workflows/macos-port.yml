name: macOS port
on:
  push:
    branches: [macos-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform-core:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and run the native file watcher
        run: |
          if ! clang++ -std=c++23 -fexperimental-library -mmacosx-version-min=14.0 -I. \
            project_watch.cpp tests/project_watch_test.cpp \
            -framework CoreServices -o /tmp/source-canvas-project-watch-test \
            > /tmp/source-canvas-watch-build.log 2>&1; then
            cat /tmp/source-canvas-watch-build.log
            tail -20 /tmp/source-canvas-watch-build.log | while IFS= read -r line; do
              echo "::error title=macOS watcher build::$line"
            done
            exit 1
          fi
          if ! /tmp/source-canvas-project-watch-test \
            > /tmp/source-canvas-watch-run.log 2>&1; then
            cat /tmp/source-canvas-watch-run.log
            tail -20 /tmp/source-canvas-watch-run.log | while IFS= read -r line; do
              echo "::error title=macOS watcher test::$line"
            done
            exit 1
          fi
      - name: Compile process and executable-path adapters
        run: |
          clang++ -std=c++23 -fexperimental-library -mmacosx-version-min=14.0 -I. \
            -c process.cpp -o /tmp/source-canvas-process.o
          printf '#include "executable_path.h"\n#include "wakeup.h"\nint main() { WakeSignal signal; return executable_path().empty(); }\n' |
            clang++ -std=c++23 -fexperimental-library -mmacosx-version-min=14.0 -I. \
              -x c++ -fsyntax-only -
      - name: Compile the native OpenGL renderer
        run: |
          brew install sdl3 libepoxy pango
          if ! clang++ -std=c++23 -fexperimental-library -mmacosx-version-min=14.0 \
            -I. $(pkg-config --cflags sdl3 epoxy pangocairo) \
            -c gpu.cpp -o /tmp/source-canvas-gpu.o \
            > /tmp/source-canvas-gpu-build.log 2>&1; then
            cat /tmp/source-canvas-gpu-build.log
            tail -20 /tmp/source-canvas-gpu-build.log | while IFS= read -r line; do
              echo "::error title=macOS renderer build::$line"
            done
            exit 1
          fi
      - name: Compile language and agent transports
        run: |
          brew install nlohmann-json
          for source in lsp.cpp agent_client.cpp; do
            if ! clang++ -std=c++23 -fexperimental-library -mmacosx-version-min=14.0 \
              -I. -I"$(brew --prefix nlohmann-json)/include" \
              -c "$source" -o "/tmp/source-canvas-${source%.cpp}.o" \
              > /tmp/source-canvas-transport-build.log 2>&1; then
              cat /tmp/source-canvas-transport-build.log
              tail -20 /tmp/source-canvas-transport-build.log | while IFS= read -r line; do
                echo "::error title=macOS transport build::$line"
              done
              exit 1
            fi
          done
      - name: Build the macOS application
        run: |
          brew install gdk-pixbuf clang-format
          python3 -m venv /tmp/source-canvas-venv
          /tmp/source-canvas-venv/bin/pip install websockets
          if ! cmake -S . -B /tmp/source-canvas-macos-build \
            -DPython3_EXECUTABLE=/tmp/source-canvas-venv/bin/python3 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DENABLE_CLANG_TIDY=OFF -DFORMAT_ON_CONFIGURE=OFF -DBUILD_TESTING=OFF \
            > /tmp/source-canvas-cmake.log 2>&1; then
            cat /tmp/source-canvas-cmake.log
            tail -20 /tmp/source-canvas-cmake.log | while IFS= read -r line; do
              echo "::error title=macOS configure::$line"
            done
            exit 1
          fi
          if ! cmake --build /tmp/source-canvas-macos-build --target white_window -j2 \
            > /tmp/source-canvas-app-build.log 2>&1; then
            cat /tmp/source-canvas-app-build.log
            tail -30 /tmp/source-canvas-app-build.log | while IFS= read -r line; do
              echo "::error title=macOS application build::$line"
            done
            exit 1
          fi
